services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: narcymorph-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: narcymorph
      POSTGRES_PASSWORD: password
      POSTGRES_DB: narcymorph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narcymorph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: narcymorph-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: narcymorph-network